name: Build on Linux

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++ build-essential

    - name: Setup vcpkg
      run: |
        git clone --depth=1 https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
        ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.VCPKG_ROOT }}/installed
          ${{ github.workspace }}/vcpkg_installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Install vcpkg dependencies
      run: |
        ${{ env.VCPKG_ROOT }}/vcpkg install --triplet=x64-linux

    - name: Configure CMake (Release)
      run: |
        cmake -B build \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_CXX_STANDARD=20

    - name: Build (Release)
      run: |
        cmake --build build --config Release --parallel $(nproc) 2>&1 | tee build-release.log

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-release
        path: build-release.log

    - name: Run tests
      run: |
        export LD_LIBRARY_PATH=${{ env.VCPKG_ROOT }}/installed/x64-linux/lib:$LD_LIBRARY_PATH
        ctest --test-dir build --output-on-failure 2>&1 | tee test-output.log

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: test-output.log

    - name: Configure CMake (Debug)
      run: |
        cmake -B build-debug \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_CXX_STANDARD=20

    - name: Build (Debug)
      run: |
        cmake --build build-debug --config Debug --parallel $(nproc) 2>&1 | tee build-debug.log

    - name: Upload debug build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-debug
        path: build-debug.log

    - name: Run tests (Debug)
      run: |
        export LD_LIBRARY_PATH=${{ env.VCPKG_ROOT }}/installed/x64-linux/debug/lib:${{ env.VCPKG_ROOT }}/installed/x64-linux/lib:$LD_LIBRARY_PATH
        ctest --test-dir build-debug --output-on-failure
