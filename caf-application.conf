# CAF 配置文件（默认名 caf-application.conf，exe 自动加载）
# 格式：花括号嵌套块（JSON-like），key = value，注释用 #（; 会解析失败）

caf-plugin-system {
  # 入口插件：只声明顶层插件，系统会自动解析依赖并拓扑排序加载
  entry-plugins = ["BusinessPlugin"]

  # 关闭顺序（可选），留空则使用依赖反序
  # shutdown-order = ["BusinessPlugin","LoggerPlugin"]

  # 启动完成后自动触发优雅关机（冒烟测试后门，验证用）
  test-auto-shutdown = true

  # @STAGED_SHARED_SCRIPT_DIRS@
}
