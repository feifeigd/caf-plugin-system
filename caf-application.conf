; CAF 配置文件（CAF 默认文件名 caf-application.ini，exe 自动加载，无需 --config-file）
; 格式：点号嵌套键 = config_value（字符串必须带引号，数组用 [...]）

; 入口插件：只声明顶层插件，系统会自动解析依赖并拓扑排序加载
caf-plugin-system.entry-plugins = ["BusinessPlugin"]

; 关闭顺序（可选），留空则使用依赖反序
; caf-plugin-system.shutdown-order = ["BusinessPlugin","LoggerPlugin"]

; 启动完成后自动触发优雅关机（冒烟测试后门，验证用）
caf-plugin-system.test-auto-shutdown = true
