# 业务表先执行 sqlite-schema.sql；启动时从 writer 读取表元数据。
# entities 是显式表白名单，省略 keys/fields 自动加载，不自动扫描全部表。
caf-plugin-system {
  entry-plugins = ["SqlitePlugin", "EntityStorePlugin"]
  sqlite {
    databases {
      reader = "./data/commerce.db"
      writer = "./data/commerce.db"
    }
    pool_size = 2
    busy_timeout_ms = 5000
  }
  entity_store {
    dialect = "sqlite"
    backend_service = "sqlite_service"
    schema_source = "database"
    request_timeout_ms = 10000
    max_pending_requests = 1024
    stores {
      commerce {
        read_connection = "reader"
        write_connection = "writer"
        idempotency_table = "__entity_store_requests"
        entities {
          order {
            table = "orders"
            version_column = "version"
          }
          payment {
            table = "payments"
            version_column = "version"
          }
        }
      }
    }
  }
}
