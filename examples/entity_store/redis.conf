# Redis 对象存取；本地开发示例，不负责配置持久化、复制或淘汰策略。
caf-plugin-system {
  entry-plugins = ["RedisPlugin", "EntityStorePlugin"]
  redis {
    uris {
      reader = "redis://127.0.0.1:6379/0"
      writer = "redis://127.0.0.1:6379/0"
    }
  }
  entity_store {
    dialect = "redis"
    backend_service = "redis_service"
    schema_source = "manual"
    request_timeout_ms = 10000
    max_pending_requests = 1024
    save_retry_attempts = 3
    load_retry_attempts = 3
    retry_backoff_ms = 100
    stores {
      commerce {
        read_connection = "reader"
        write_connection = "writer"
        idempotency_table = "__commerce_requests"
        entities {
          order {
            table = "orders"
            keys {
              order_id {
                column = "order_id"
                kind = "text"
                nullable = false
              }
            }
            fields {
              status {
                column = "status"
                kind = "text"
                nullable = false
              }
              paid_cents {
                column = "paid_cents"
                kind = "signed_integer"
                nullable = true
              }
              details {
                column = "details"
                kind = "json"
                nullable = true
              }
            }
          }
          payment {
            table = "payments"
            keys {
              payment_id {
                column = "payment_id"
                kind = "text"
                nullable = false
              }
            }
            fields {
              state {
                column = "state"
                kind = "text"
                nullable = false
              }
            }
          }
        }
      }
    }
  }
}
