# 要求已启动支持事务的 MongoDB 副本集；单节点 rs0 可用于开发验证。
# reader/writer 默认都指向主节点，生产读副本可单独配置 reader URI 的 readPreference。
caf-plugin-system {
  entry-plugins = ["MongoPlugin", "EntityStorePlugin"]
  mongo {
    uris {
      reader = "mongodb://127.0.0.1:27017/commerce?replicaSet=rs0&directConnection=true"
      writer = "mongodb://127.0.0.1:27017/commerce?replicaSet=rs0&directConnection=true"
    }
    pool_size = 2
  }
  entity_store {
    dialect = "mongodb"
    backend_service = "mongo_service"
    schema_source = "manual"
    request_timeout_ms = 10000
    max_pending_requests = 1024
    save_retry_attempts = 3
    load_retry_attempts = 3
    retry_backoff_ms = 100
    stores {
      commerce {
        read_connection = "reader"
        write_connection = "writer"
        idempotency_table = "__entity_store_requests"
        entities {
          order {
            table = "orders"
            version_column = "version"
            keys {
              order_id {
                column = "order_id"
                kind = "text"
              }
            }
            fields {
              status {
                column = "status"
                kind = "text"
                nullable = false
              }
              paid_cents {
                column = "paid_cents"
                kind = "signed_integer"
                nullable = false
              }
              note {
                column = "note"
                kind = "text"
                nullable = true
              }
            }
          }
          payment {
            table = "payments"
            version_column = "version"
            keys {
              payment_id {
                column = "payment_id"
                kind = "text"
              }
            }
            fields {
              state {
                column = "state"
                kind = "text"
                nullable = false
              }
            }
          }
        }
      }
    }
  }
}
